name: Deploy to Cloudflare Pages

# Publishes the catalog to https://leo-registry.pages.dev on every push to main.
# The public/ directory is staged here (it's a gitignored build artifact) from
# the repo's registry.json + schema/ + bundles/ + icons/, then deployed via
# wrangler.
#
# icons/ is staged because entries carry an absolute `icon_url` pointing at
# /icons/<name>.png on THIS host. They used to point at the store-admin
# Worker, which serves artwork out of its own D1 and is the only place those
# PNGs existed — so a hub reading this catalog instead fetched nothing and fell
# back to drawing the `icon` glyph. Shipping the bytes beside the catalog that
# names them is what makes this catalog self-contained.

on:
  push:
    branches: [main]
    paths:
      - registry.json
      - schema/**
      - bundles/**
      - icons/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage public directory
        run: |
          mkdir -p public/bundles public/icons
          cp registry.json public/
          [ -d schema ] && cp -r schema public/ || true
          [ -d bundles ] && cp -r bundles/. public/bundles/ || true
          [ -d icons ] && cp -r icons/. public/icons/ || true
          printf '%s\n' 'leo-registry — see /registry.json' > public/index.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=leo-registry --branch=main --commit-dirty=true
